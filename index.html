<style>:root{--bg:#f3f5f4;--card:#fff;--ink:#1d2523;--sub:#6b7774;--line:#e1e6e4;--brand:#1f9e92;--brand-d:#14766c;--brand-l:#d9f2ee;--pt:#ffc531;--warn:#e5483f;--warn-l:#fde8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1c2421;--ink:#eef3f1;--sub:#97a5a1;--line:#2c3733;--brand:#4cc9bc;--brand-d:#7fe0d5;--brand-l:#17332f;--warn-l:#3a1f1d}}
:root[data-theme="dark"]{--bg:#121816;--card:#1c2421;--ink:#eef3f1;--sub:#97a5a1;--line:#2c3733;--brand:#4cc9bc;--brand-d:#7fe0d5;--brand-l:#17332f;--warn-l:#3a1f1d}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;line-height:1.5;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
#main{flex:1;overflow-y:auto;padding:16px 16px 24px}
h1{font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.3}h2{font-size:16px;font-weight:700;margin:22px 0 10px}
.sub{color:var(--sub);font-size:12.5px}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{display:block;width:100%;background:var(--brand);color:#fff;font-weight:700;padding:13px;border-radius:12px;text-align:center}
.btn.ghost{background:var(--brand-l);color:var(--brand-d)}.btn:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card)}.tabs button{flex:1;padding:10px 0 12px;font-size:11.5px;color:var(--sub)}.tabs button b{display:block;font-size:19px;line-height:1.2}.tabs .on{color:var(--brand);font-weight:700}
.hero{background:var(--brand);color:#fff;border-radius:18px;padding:18px}.hero .big{font-size:32px;font-weight:900;letter-spacing:-.03em}
.bar{height:8px;background:rgba(255,255,255,.3);border-radius:9px;margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pt)}
.alert{background:var(--warn-l);color:var(--warn);border-radius:12px;padding:11px 13px;font-weight:500;margin-top:12px}
.alert.ok{background:var(--brand-l);color:var(--brand-d)}
.show{display:flex;gap:12px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
.poster{width:62px;height:82px;border-radius:9px;flex:none;display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:11px;font-weight:700}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--brand-l);color:var(--brand-d);font-weight:500}.tag.w{background:var(--warn-l);color:var(--warn)}
.price{font-weight:700}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:5}
.scrim.mid{align-items:center;padding:24px}
.sheet{background:var(--bg);width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto;animation:up .2s}
.mid .sheet{border-radius:20px}
@keyframes up{from{transform:translateY(24px);opacity:0}}@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.seat{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;width:100%;background:var(--card);text-align:left}
.seat.on{border:2px solid var(--brand);padding:10px 11px}
.seat.no{opacity:.55}
.sum{background:var(--card);border-radius:12px;padding:12px;margin:12px 0;border:1px dashed var(--line)}.sum div{display:flex;justify-content:space-between;padding:2px 0}
input[type=number],input[type=text]{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.tog{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none}.tog.on{background:var(--brand)}.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}.tog.on::after{left:21px}
.step{display:flex;gap:6px;margin-bottom:22px}.step i{flex:1;height:4px;border-radius:4px;background:var(--line)}.step i.on{background:var(--brand)}
.reg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.reg button{padding:12px 4px;border:1px solid var(--line);border-radius:11px;background:var(--card)}.reg .on{border:2px solid var(--brand);color:var(--brand-d);font-weight:700}

.note{font-size:11.5px;color:var(--sub);margin-top:8px}
.star{font-size:26px;color:var(--line)}.star.on{color:var(--pt)}

/* ===== 온누리 스타일 리디자인 (파란 헤더 + 흰 잔액 카드 + 중앙 원형 버튼 탭바) ===== */
:root{--bg:#f2f4f8;--brand:#2b64f5;--brand-d:#1a45c4;--brand-l:#e8efff;--line:#e4e8f0}

.pcard{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#1a45c4,#4f8bff);margin-bottom:14px}
.barcode{height:54px;border-radius:8px;margin-top:14px;background:#fff repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 5px,#111 5px 6px,#fff 6px 9px,#111 9px 12px,#fff 12px 14px)}
.nrow{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.lbl{font-size:12px;color:var(--sub);margin-bottom:4px}

/* ===== 화면 전환 ===== */
#main.vin{animation:vin .26s cubic-bezier(.2,.7,.2,1)}

.chip,.btn,.card,.seat,.tabs button{transition:background-color .15s,border-color .15s,color .15s,transform .1s}
.btn:active,.chip:active,.seat:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){#main.vin,.scrim,.sheet{animation:none}*{transition:none!important}}

 <div class="hs" style="margin:6px 0 4px"><button class="banner" onclick="st.tab='perk';home()"><b style="font-size:16px">신규 발급 인증샷 이벤트</b><br><span style="opacity:.9;font-size:12.5px">팝콘 쿠폰 추첨 · ~11/30</span></button><button class="banner b2" onclick="st.tab='perk';home()"><b style="font-size:16px">첫 장르 도전 챌린지</b><br><span style="opacity:.9;font-size:12.5px">처음 보는 장르 관람 시 쿠폰 · ~12/31</span></button></div>
 <div class="pad"><h2>내 잔액으로 볼 수 있는 맞춤 공연</h2></div>${rc.length?`<div class="hs">${rc.map(s=>`<button class="mini" onclick="detail(${s.id})"><div class="poster" style="background:${grad(s.id)}">${s.g}</div><div class="b"><div style="font-weight:700;font-size:13px;line-height:1.3">${s.t}</div><div class="sub">${s.r}</div><div class="price">${W(minP(s))}~</div></div></button>`).join('')}</div>`:'<p class="sub pad">조건에 맞는 공연이 없어요. 공연 찾기에서 분야를 넓혀 보세요.</p>'}
 ${st.nt.survey&&st.hist.length&&!st.sv.done?`<div class="pad"><button class="card row" style="width:100%;margin-top:14px;text-align:left" onclick="survey()"><span style="color:var(--brand)">${ic('edit')}</span><span style="flex:1"><b>관람은 어떠셨나요?</b><br><span class="sub">1분 만족도 조사 · 참여하면 쿠폰 지급</span></span>›</button></div>`:''}`}
function inR(p,f){const L={'3만원 이하':3e4,'7만원 이하':7e4,'10만원 이하':1e5};return f=='전체'||p<=L[f]}
function rOK(s){const f=st.rF;return f=='전체'||(f=='내 지역'?s.r==st.region:f=='전국'?s.r=='전국':s.r==f)}
function vFind(){
 const c={};SHOWS.forEach(s=>c[s.r]=(c[s.r]||0)+1);const mine=c[st.region]||0;
 const others=Object.keys(c).filter(r=>r!='전국'&&r!=st.region).sort((x,y)=>c[y]-c[x]);
 const R=[['전체',`전체 ${SHOWS.length}`],['내 지역',`내 지역(${st.region}) ${mine}`],['전국',`전국 공통 ${c['전국']||0}`],...others.map(r=>[r,`${r} ${c[r]}`])];
 const l=SHOWS.filter(s=>(st.gF=='전체'||s.g==st.gF)&&inR(minP(s),st.pF)&&(!st.fit||minP(s)<=st.bal)&&rOK(s)).sort((x,y)=>(st.ints.includes(y.g)-st.ints.includes(x.g))||((x.r==st.region?0:x.r=='전국'?1:2)-(y.r==st.region?0:y.r=='전국'?1:2))||minP(x)-minP(y));
 const ds=st.rF=='전체'?'모든 지역의 공연을 보여줘요':st.rF=='내 지역'?`${st.region}에서 열리는 공연만 보여줘요`:st.rF=='전국'?'영화·도서처럼 전국 어디서나 쓸 수 있는 항목이에요':`${st.rF}에서 열리는 공연만 보여줘요`;
 $('#main').innerHTML=`<h1>공연 찾기</h1><p class="sub" style="margin:4px 0 14px">관심 분야와 내 지역이 먼저 보여요</p>
 <div class="lbl">지역</div><div class="hs" style="padding:0;margin-bottom:4px">${R.map(r=>`<button class="chip ${st.rF==r[0]?'on':''}" onclick="st.rF='${r[0]}';vFind()">${r[1]}</button>`).join('')}</div>
 <p class="note" style="margin:0 0 12px">${ds}</p>
 <div class="lbl">분야</div><div class="hs" style="padding:0;margin-bottom:12px">${['전체',...GEN].map(g=>`<button class="chip ${st.gF==g?'on':''}" onclick="st.gF='${g}';vFind()">${g}</button>`).join('')}</div>
 <div class="lbl">가격 (가장 저렴한 좌석 기준)</div><div class="chips" style="margin-bottom:12px">${['전체','3만원 이하','7만원 이하','10만원 이하'].map(g=>`<button class="chip ${st.pF==g?'on':''}" onclick="st.pF='${g}';vFind()">${g}</button>`).join('')}</div>
 <div class="card row between" style="margin-bottom:14px"><span>남은 지원금 <b>${W(st.bal)}</b>으로 가능한 것만</span><button class="tog ${st.fit?'on':''}" onclick="st.fit=!st.fit;vFind()" aria-label="잔액 맞춤"></button></div>
 <div class="row between" style="margin-bottom:8px"><b>${l.length}개</b></div>
 ${l.length?l.map(showCard).join(''):`<div class="card sub">조건에 맞는 공연이 없어요.${st.rF=='내 지역'?` 현재 등록된 ${st.region} 공연이 적어요. '전국 공통'이나 다른 지역을 눌러 보세요.`:' 필터를 줄여 보세요.'}</div>`}`}
function vPerk(){
 $('#main').innerHTML=`<h1>혜택</h1><h2>진행 중인 이벤트</h2>${EVENTS.map(e=>`<div class="card" style="margin-bottom:10px"><div class="row between"><b>${e.t}</b><span class="tag">${e.b}</span></div><div class="sub" style="margin-top:4px">${e.d}</div></div>`).join('')}
 <h2>받을 수 있는 쿠폰</h2>${COUPONS.map(c=>{const h=st.coupons.includes(c.id);return `<div class="coupon"><div><b>${c.t}</b><div class="sub">${c.d}</div></div><div>${h?'<span class="sub">보관 중</span>':`<button onclick="st.coupons.push('${c.id}');toast('쿠폰을 받았어요');vPerk()" style="color:var(--brand-d);font-weight:700">받기</button>`}</div></div>`}).join('')}<p class="note">※ 쿠폰은 예매 단계에서 선택 적용되는 방식으로 설계했어요.</p>`}
function vMy(){
 const m=st.mode;
 $('#main').innerHTML=`<h1>MY</h1>
 <div class="card" style="margin:12px 0"><div class="row between"><b>${st.region} · ${st.plat}</b><button class="tag" onclick="st.step=2;st.chg=true;st.hist=[];onboard()">지역 변경</button></div><div class="sub" style="margin:4px 0 8px">관심 분야</div><div class="chips">${GEN.map(g=>`<button class="chip ${st.ints.includes(g)?'on':''}" onclick="tg2('${g}')">${g}</button>`).join('')}</div></div>
 <h2>사용 내역</h2><div class="card">${st.hist.length?st.hist.map((h,k)=>histRow(h,k)).join(''):'<span class="sub">아직 사용 내역이 없어요. 공연 찾기에서 첫 관람을 골라보세요.</span>'}</div>
 <h2>알림 설정</h2><div class="card">${[['bal','잔여 지원금·기한 알림'],['survey','만족도 조사 알림'],['event','이벤트·쿠폰 알림']].map(a=>`<div class="row between" style="padding:6px 0"><span>${a[1]}</span><button class="tog ${st.nt[a[0]]?'on':''}" onclick="st.nt['${a[0]}']=!st.nt['${a[0]}'];vMy()" aria-label="${a[1]}"></button></div>`).join('')}</div>
 <h2>제도 시나리오 (연구용)</h2><div class="chips"><button class="chip ${m=='y26'?'on':''}" onclick="setMode('y26')">2026 현행</button><button class="chip ${m=='y27'?'on':''}" onclick="setMode('y27')">2027 정부안</button></div><p class="note">2027안: 19~34세, 인당 10~15만원, 매년 지급, 국회 심의 중이라 변경될 수 있어요. (수도권 10 / 비수도권 15로 가정)</p>
 <button class="btn ghost" style="margin-top:16px" onclick="st.promo=true;st.tab='home';home()">홍보 팝업 다시 보기</button>
 <button class="btn ghost" style="margin-top:8px" onclick="location.reload()">처음부터 다시 체험</button>`}
function tg2(g){const i=st.ints.indexOf(g);if(i<0)st.ints.push(g);else if(st.ints.length>1)st.ints.splice(i,1);vMy()}
function setMode(k){st.mode=k;const used=st.total-st.bal;st.total=total();st.bal=Math.max(0,st.total-used);vMy()}
function closeLayer(){L.innerHTML=''}
function promo(){L.innerHTML=`<div class="scrim mid" onclick="if(event.target==this)closeLayer()"><div class="sheet" style="padding:0;overflow:hidden"><div style="background:linear-gradient(140deg,#1f9e92,#4cc9bc);color:#fff;padding:26px 20px"><div class="tag" style="background:#ffc531;color:#1d2523">NEW</div><h1 style="margin-top:10px">첫 관람 인증하면<br>팝콘 쿠폰 증정!</h1><p style="margin-top:6px;opacity:.9">신규 장르 도전 챌린지 · ~12/31</p></div><div class="row" style="padding:12px;gap:8px"><button class="btn ghost" onclick="closeLayer()">오늘은 그만 보기</button><button class="btn" onclick="closeLayer();st.tab='perk';home()">이벤트 보기</button></div></div></div>`}
function detail(id){const s=SHOWS.find(x=>x.id==id);st.sel={s,i:0};dsheet()}
function dsheet(){const {s,i}=st.sel,x=s.seats[i],p=x[1],o=x[2]||null,pass=Math.min(st.bal,p),own=p-pass,mism=o&&o.rg&&o.rg!=st.region;
 L.innerHTML=`<div class="scrim" onclick="if(event.target==this)closeLayer()"><div class="sheet"><div class="row" style="gap:12px"><div class="poster" style="background:${grad(s.id)}">${s.g}</div><div><span class="tag">${s.r}</span><h2 style="margin:4px 0 2px">${s.t}</h2><div class="sub">${s.v} · ${s.p}</div></div></div>
 <div class="sub" style="margin-top:8px">${s.nd?stat(s).t:fmt(s.s)+' ~ '+fmt(s.e)}${s.n?' · '+s.n:''}</div>${s.est?'<p class="note">※ 이 항목의 가격은 예시값이에요. 실제 요금은 예매처에서 확인하세요.</p>':''}
 <h2>좌석·옵션 선택</h2>${s.seats.map((y,k)=>{const dd=y[2];return `<button class="seat ${k==i?'on':''} ${!dd&&y[1]>st.bal?'no':''}" onclick="st.sel.i=${k};dsheet()"><span><b>${y[0]}</b>${dd?`<br><span class="tag w">${dd.k} · 예매처 확인 필요</span>`:''}</span><span style="text-align:right">${W(y[1])}<br>${dd?'':(y[1]>st.bal?'<span class="tag w">자부담 '+W(y[1]-st.bal)+'</span>':'<span class="tag">전액 지원</span>')}</span></button>`}).join('')}
 ${o?`<div class="alert"><b>${o.k}</b>는 앱에서 바로 적용할 수 없어요. 예매처에서 해당 권종을 직접 선택하고 조건을 확인해야 해요.${mism?`<br>이 할인은 ${o.rg} 대상이라 내 지역(${st.region})은 해당하지 않을 수 있어요.`:''}</div>
 <div class="sum"><div><span>예상 금액 (예매처에서 확정)</span><span>${W(p)}</span></div><div class="sub"><span>지원금 반영</span><span>예매처 확인 후</span></div></div>
 <button class="btn" onclick="st.ck=false;dchk()">예매처 확인 사항 보고 이동하기</button>`
 :`<div class="sum"><div><span>티켓 금액</span><span>${W(p)}</span></div><div><span>패스 사용</span><span style="color:var(--brand-d)">-${W(pass)}</span></div><div><b>내가 낼 금액</b><b>${W(own)}</b></div><div class="sub"><span>사용 후 잔액</span><span>${W(st.bal-pass)}</span></div></div>
 ${own>0?`<div class="alert">좌석을 한 단계 낮추면 전액 지원돼요</div>`:''}
 <p class="note" style="margin:0 0 10px">※ 좌석별 가격과 잔여석은 예매처 실시간 데이터 연동이 필요해요(API 확인 필요).</p>
 <button class="btn" onclick="redir()" ${st.bal==0?'disabled':''}>${s.p}에서 예매하기</button>`}</div></div>`}
function dchk(){const {s,i}=st.sel,x=s.seats[i],o=x[2];
 L.innerHTML=`<div class="scrim" onclick="if(event.target==this)closeLayer()"><div class="sheet"><h2 style="margin-top:0">예매처에서 꼭 확인하세요</h2><div class="card" style="margin-bottom:10px"><b>${s.t}</b><div class="sub">${x[0]} · 예상 ${W(x[1])} (예매처에서 확정)</div></div>
 <div class="card" style="line-height:1.7"><b>${o.k} 확인 순서</b><br>1. ${s.p}에서 예매할 때 '${x[0]}' 권종을 직접 골라요.<br>2. 조건: ${o.c}<br>3. 증빙을 못 하면 현장에서 차액을 내야 할 수 있어요.<br>4. 결제 후 앱으로 돌아와 <b>사용내역에서 '확인 완료'</b>를 눌러야 지원금이 반영돼요.</div>
 <button class="chip ${st.ck?'on':''}" style="margin:12px 0;width:100%;text-align:left" onclick="st.ck=!st.ck;dchk()">${st.ck?'✓':'□'} 조건과 필요한 증빙을 확인했어요</button>
 <button class="btn" ${st.ck?'':'disabled'} onclick="redir()">${s.p}로 이동</button><button class="btn ghost" style="margin-top:8px" onclick="dsheet()">뒤로</button></div></div>`}
function redir(){const {s,i}=st.sel;L.innerHTML=`<div class="scrim mid"><div class="sheet" style="text-align:center"><h2 style="margin:6px 0">${s.p}로 이동할게요</h2><p class="sub">패스 포인트를 쓸 수 있는 예매처 화면으로 연결돼요.<br>예매를 마치면 앱으로 돌아와 사용 내역을 반영해요.</p><div style="height:14px"></div><button class="btn" onclick="done()">이동 후 예매 완료 (시뮬레이션)</button><button class="btn ghost" style="margin-top:8px" onclick="dsheet()">취소</button></div></div>`}
function done(){const {s,i}=st.sel,x=s.seats[i],p=x[1],pass=Math.min(st.bal,p);if(x[2]){st.hist.unshift({t:s.t,seat:x[0],p:s.p,pass,pend:true});closeLayer();toast('예매처에서 할인 적용을 확인해 주세요');home();return}st.bal-=pass;st.hist.unshift({t:s.t,seat:x[0],p:s.p,pass});closeLayer();toast(`${W(pass)} 사용 처리됐어요`);home()}
function okPend(k){const h=st.hist[k];h.pend=false;h.pass=Math.min(st.bal,h.pass);st.bal-=h.pass;toast('지원금에 반영했어요');vMy()}
function noPend(k){st.hist.splice(k,1);toast('확인 대기 내역을 삭제했어요');vMy()}
const pendN=()=>st.hist.filter(h=>h.pend);
function histRow(h,k){return h.pend?`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row between"><span>${h.t}<br><span class="sub">${h.seat} · ${h.p}</span></span><b>예상 -${W(h.pass)}</b></div><div class="alert" style="margin:8px 0 6px">예매처에서 할인이 적용됐는지 확인해 주세요</div><div class="row" style="gap:8px"><button class="btn" style="padding:9px" onclick="okPend(${k})">확인 완료·반영</button><button class="btn ghost" style="padding:9px" onclick="noPend(${k})">할인 안 됨·취소</button></div></div>`:`<div class="row between" style="padding:5px 0"><span>${h.t}<br><span class="sub">${h.seat} · ${h.p}</span></span><b>-${W(h.pass)}</b></div>`}
function survey(){let r=0;const draw=()=>{L.innerHTML=`<div class="scrim mid" onclick="if(event.target==this)closeLayer()"><div class="sheet"><h2 style="margin-top:0">패스 만족도</h2><p class="sub">${st.hist[0].t}을(를) 보셨네요</p><div class="row" style="gap:2px;margin:8px 0">${[1,2,3,4,5].map(n=>`<button class="star ${n<=r?'on':''}" onclick="rate(${n})" aria-label="${n}점">★</button>`).join('')}</div><div class="sub" style="margin:10px 0 6px">가장 아쉬운 점</div><div class="chips">${['티켓 가격','시간 부족','이동·교통','예매 절차','볼 공연 부족'].map(c=>`<button class="chip" onclick="this.classList.toggle('on')">${c}</button>`).join('')}</div><div style="height:16px"></div><button class="btn" onclick="st.sv.done=true;st.coupons.push('c1');closeLayer();toast('참여 감사! 쿠폰이 지급됐어요');home()">제출하고 쿠폰 받기</button></div></div>`};window.rate=n=>{r=n;draw()};draw()}
render();
</script>
</body></html>
